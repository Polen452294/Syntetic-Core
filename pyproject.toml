[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syntetic-core"
version = "0.1.0"
description = "Persistent device identities and native browser sessions for automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright==1.62.0", "camoufox==0.5.8", "browserforge[all]==1.2.4",
  "pydantic==2.14.0", "pydantic-settings==2.15.0", "httpx[socks]==0.28.1",
  "PyYAML==6.0.3", "websockets==15.0.1", "psutil==7.2.2", "tzdata==2026.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "mypy==1.20.2", "build>=1.2", "types-PyYAML", "types-psutil"]

[project.scripts]
syntetic-core = "syntetic_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"syntetic_core" = ["py.typed"]
"syntetic_core._engine.browser" = ["*.js", "assets/*.mp4", "extensions/content_filter/*.json", "extensions/native/*.c"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: requires installed Chromium and the prepared driver"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/syntetic_core/core.py", "src/syntetic_core/proxy.py", "src/syntetic_core/cli.py"]
follow_imports = "silent"
